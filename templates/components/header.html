<!-- Main Workspace Header & Search Bar -->
<header class="workspace-header">
    <div class="header-title-group">
        <h1 id="page-heading">Mathematical Insights & Essays</h1>
        <p id="page-subheading">Exploring equations, proofs, and mathematical thinking.</p>
    </div>

    <!-- Live Story Search Input with Keyboard Shortcut Badge -->
    <div class="search-bar-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search math stories..." onkeyup="onSearchInput()">
        <kbd class="search-shortcut">Ctrl+K</kbd>
    </div>
</header>
