<!-- Article Reader Full Overlay -->
<div class="reader-overlay" id="reader-overlay">
    <button class="btn-close-reader" onclick="closeReader()" title="Close Article Reader">✕</button>
    <article class="reader-content">
        <div class="reader-tag" id="reader-tag">CATEGORY</div>
        <h1 class="reader-title" id="reader-title">Title</h1>
        <p class="reader-subtitle" id="reader-subtitle">Subtitle</p>

        <!-- Article Metadata Strip -->
        <div class="meta-strip" style="margin-bottom: 2.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
            <span class="meta-author" id="reader-author">Author</span>
            <span class="dot">•</span>
            <span id="reader-date">Date</span>
            <span class="dot">•</span>
            <span id="reader-readtime">📖 3 min read</span>
        </div>

        <!-- Article Body with LaTeX Render Target -->
        <div class="reader-body" id="reader-body">
            <!-- Article text dynamically rendered -->
        </div>
    </article>
</div>
