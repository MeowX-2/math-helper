<!-- Featured Hero Story Card -->
<section id="hero-card" onclick="openHeroReader()">
    <div class="hero-top-line"></div>
    <div class="hero-badge-wrap">
        <span class="hero-tag" id="hero-tag">FEATURED STORY</span>
    </div>
    <h2 class="hero-title" id="hero-title">Loading Featured Article...</h2>
    <p class="hero-excerpt" id="hero-excerpt">Summary and insights will be displayed here.</p>
    <div class="hero-footer-strip">
        <div class="meta-strip">
            <span class="meta-author" id="hero-author">Author</span>
            <span class="dot">•</span>
            <span id="hero-date">Date</span>
            <span class="dot">•</span>
            <span id="hero-readtime">📖 3 min read</span>
        </div>
        <span class="hero-read-cta">Read Article <span class="arrow">→</span></span>
    </div>
</section>
