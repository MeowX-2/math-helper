<!-- Left Fixed Navigation Sidebar -->
<aside id="sidebar">
    <!-- Brand Title & Home Action -->
    <a class="brand-header" onclick="resetTopic()" title="HintSpark Home">
        <div class="brand-icon">∑</div>
        <div class="brand-title-wrap">
            <span class="brand-title">HintSpark</span>
            <span class="brand-badge">AI v2.0</span>
        </div>
    </a>

    <!-- Main Navigation Links -->
    <div class="nav-section-title">Navigation</div>
    <ul class="nav-list">
        <li><a class="nav-item active" id="nav-item-all" onclick="selectTopic('All', this)"><span class="icon">📰</span> Feed & Articles</a></li>
        <li><a class="nav-item" id="nav-item-guide" onclick="openUserGuide(this)"><span class="icon">📖</span> User Guide & Manual</a></li>
    </ul>

    <!-- Dynamic Tag Cloud Navigation -->
    <div class="nav-section-title">Topic Tags</div>
    <div class="sidebar-tag-cloud" id="sidebar-tag-cloud">
        <!-- Dynamically populated tags from app.js -->
    </div>

    <!-- Quick Feature Shortcuts -->
    <div class="nav-section-title">Interactive Tools</div>
    <ul class="nav-list">
        <li><a class="nav-item" onclick="toggleTutorDrawer()"><span class="icon">🤖</span> AI Math Assistant</a></li>
        <li><a class="nav-item" onclick="openPublishModal()"><span class="icon">✍️</span> New Article</a></li>
        <li><a class="nav-item" onclick="openSettingsModal()"><span class="icon">⚙️</span> API Settings</a></li>
    </ul>

    <!-- Action Buttons & Theme Toggler -->
    <div class="sidebar-actions">
        <button class="btn-sidebar-primary" onclick="openPublishModal()">
            <span>+</span> New Article
        </button>

        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <span id="theme-text">🌙 Dark Mode</span>
            <span id="theme-icon">✨</span>
        </button>
    </div>
</aside>
