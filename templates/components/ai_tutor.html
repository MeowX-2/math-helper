<!-- AI Math Assistant Side Drawer -->
<div class="ai-tutor-drawer" id="tutor-drawer">
    <!-- Drawer Header -->
    <div class="tutor-header">
        <div class="tutor-header-title">
            <span class="tutor-status-dot"></span>
            <span>HintSpark AI Assistant</span>
        </div>
        <div class="tutor-header-actions">
            <button onclick="resetTutorChat()" class="tutor-header-btn" title="Start New Conversation">🔄 New Chat</button>
            <button onclick="toggleTutorDrawer()" class="tutor-close-btn" title="Close AI Assistant">✕</button>
        </div>
    </div>

    <!-- Message Stream Container -->
    <div class="tutor-messages" id="tutor-messages">
        <div class="tutor-msg tutor-ai-msg">
            Hello! I am your Socratic AI math tutor. Ask me any equation or problem concept — I will guide you with targeted questions and hints without giving away the final solution!
        </div>
    </div>

    <!-- Chat Drawer Footer Controls -->
    <div class="tutor-footer">
        <div class="tutor-chips-bar">
            <span class="chips-label">Quick Prompts:</span>
            <button class="tutor-chip" onclick="setTutorPrompt('How do I solve $x^2 - 5x + 6 = 0$?')">Algebra</button>
            <button class="tutor-chip" onclick="setTutorPrompt('Explain the intuition behind $\\int x^2 dx$')">Calculus</button>
            <button class="tutor-chip" onclick="setTutorPrompt('Why is $e^{i\\pi} + 1 = 0$ true?')">Euler</button>
        </div>

        <div class="tutor-input-bar">
            <textarea id="tutor-input" rows="1" placeholder="Ask a math problem (e.g. $x^2 - 4 = 0$)..." onkeydown="handleTutorInputKeyDown(event)"></textarea>
            <button id="tutor-send-btn" onclick="sendTutorMessage()">Ask</button>
        </div>
    </div>
</div>
