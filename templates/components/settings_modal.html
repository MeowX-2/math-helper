<!-- Multi-Provider API Key & .env Setup Modal Dialog -->
<div class="modal-overlay" id="settings-modal">
    <div class="modal-card">
        <!-- Close Button -->
        <button style="position: absolute; top: 1.2rem; right: 1.5rem; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);" onclick="closeSettingsModal()" title="Close Settings">✕</button>
        <h2 class="modal-title">🔑 AI Model API Setup</h2>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.25rem; line-height: 1.5;">
            To use the <strong>AI Math Assistant</strong>, enter your <strong>Google Gemini</strong> or <strong>Anthropic Claude</strong> API key below. HintSpark automatically detects your provider.
        </p>

        <form onsubmit="handleSaveApiKey(event)">
            <div class="form-group">
                <label for="custom-api-key">Gemini or Claude API Key</label>
                <input type="password" id="custom-api-key" placeholder="AIzaSy... or sk-ant-..." autocomplete="off" required>
                <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem;">
                    💡 <em>Tip: Supports Gemini (<code>AIzaSy...</code>) & Claude (<code>sk-ant-...</code>). Quotes are cleaned automatically.</em>
                </p>
                <div style="margin-top: 0.6rem; font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 1rem; justify-content: space-between; align-items: center;">
                    <span>Get a key:</span>
                    <div style="display: flex; gap: 0.75rem;">
                        <a href="https://aistudio.google.com/" target="_blank" rel="noopener" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Google Gemini ↗</a>
                        <a href="https://console.anthropic.com/" target="_blank" rel="noopener" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Anthropic Claude ↗</a>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn-submit-story" style="flex: 1; margin-top: 0;">Save & Create .env File</button>
                <button type="button" onclick="clearApiKey()" class="theme-toggle-btn" style="padding: 0.85rem 1.2rem;">Clear Key</button>
            </div>
        </form>
    </div>
</div>
