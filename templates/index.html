<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HintSpark — Mathematical Insights & AI Assistant</title>
    
    <!-- Industry Standard Typography: Outfit (Display & Headings), Plus Jakarta Sans (UI & Controls), Inter (Body & Content), JetBrains Mono (Code & Metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX Mathematical Notation Renderer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- Marked.js Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- External Application Stylesheet & Client Script -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>

    <!-- Main Dashboard Layout Grid -->
    <div id="app-layout">
        <!-- Sidebar Navigation Component -->
        {% include 'components/sidebar.html' %}

        <!-- Main Workspace Area -->
        <main id="main-content">
            <!-- Header Component -->
            {% include 'components/header.html' %}

            <!-- Featured Hero Story Component -->
            {% include 'components/hero.html' %}

            <!-- Dynamic Articles Feed Grid -->
            <div class="section-label-bar" id="grid-label">Recent Math Articles</div>
            <section id="articles-grid">
                <!-- Dynamically populated via app.js fetchArticles() -->
            </section>
        </main>
    </div>

    <!-- AI Math Assistant Drawer Component -->
    {% include 'components/ai_tutor.html' %}

    <!-- Publish Article Modal Component -->
    {% include 'components/publish_modal.html' %}

    <!-- Article Reader Overlay Component -->
    {% include 'components/reader_modal.html' %}

</body>
</html>
