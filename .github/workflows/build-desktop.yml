name: Build Desktop Apps (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Windows Executables & Setup Installer
        run: |
          python build_exe.py

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HintSpark_Setup-Windows
          path: dist/HintSpark_Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for WebKit & PyWebView
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libgirepository1.0-dev gcc

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Linux Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name HintSpark --add-data "templates:templates" --add-data "static:static" --add-data "data:data" desktop_app.py
          cd dist
          tar -czvf HintSpark-Linux-x86_64.tar.gz HintSpark/

      - name: Upload Linux Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HintSpark-Linux-x86_64
          path: dist/HintSpark-Linux-x86_64.tar.gz
