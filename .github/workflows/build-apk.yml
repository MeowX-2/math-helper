name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build APK
        run: |
          mkdir -p build-twa
          cd build-twa
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/static/manifest.json --skipManifestValidation
          bubblewrap build --skipSigning || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HintSpark-Android-APK
          path: '**/*.apk'
